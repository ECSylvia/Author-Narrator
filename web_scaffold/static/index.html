<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author Narrator | Doxie Hub</title><style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:1rem;color:#233b33}textarea{width:100%;min-height:220px}button{padding:.7rem 1rem;background:#164237;color:white;border:0;border-radius:6px}input{display:block;margin:1rem 0}pre{white-space:pre-wrap;background:#f3f7f5;padding:1rem;border-radius:8px}</style></head><body><a href="http://127.0.0.1:5173/">← Doxie Hub</a><h1>Author Narrator</h1><p>Manuscript preview. Local development only. No voice engine connected.</p><label>Filename (.md or .txt)<input id="filename" value="book.md"></label><label>Manuscript text<textarea id="content"># Chapter One
Once upon a time...</textarea></label><p><button id="preview">Preview chapters</button></p><pre id="result" aria-live="polite"></pre><script>document.getElementById('preview').addEventListener('click',async()=>{const result=document.getElementById('result');result.textContent='Loading...';try{const r=await fetch('/manuscripts/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:document.getElementById('filename').value,content:document.getElementById('content').value})});const data=await r.json();result.textContent=JSON.stringify(data,null,2);}catch(e){result.textContent='Preview failed: '+e.message}})</script></body></html>
